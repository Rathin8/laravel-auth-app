services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-practice-app
    ports:
      - "9001:80"
    env_file:
      - .env
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: host.docker.internal
      DB_PORT: 3377
      DB_DATABASE: laravel_practice
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
